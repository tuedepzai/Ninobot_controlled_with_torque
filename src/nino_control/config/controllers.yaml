controller_manager:
  ros__parameters:
    # Match the world's 1 ms physics step to avoid control/simulation aliasing.
    update_rate: 1000
    use_sim_time: true
    enforce_command_limits: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    wheel_effort_controller:
      type: effort_controllers/JointGroupEffortController

wheel_effort_controller:
  ros__parameters:
    joints:
      - left_wheel_joint
      - right_wheel_joint

joint_state_broadcaster:
  ros__parameters:
    # Supply fresh velocity feedback to the 1 kHz effort loop, including
    # while a wheel is briefly unloaded as it crosses a cable.
    publish_rate: 500.0
